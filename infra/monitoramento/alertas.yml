groups:
  - name: portal
    rules:
      - alert: PortalForaDoAr
        expr: probe_success{job="sondas"} == 0
        for: 2m
        labels: { severidade: critica }
        annotations:
          resumo: "{{ $labels.alvo }} não responde há 2 minutos"
          oque_fazer: "docker compose ps; docker compose logs web --tail 100 (ver docs/CONFIGURACOES-E-PROCESSOS.md)"

      - alert: BancoIndisponivel
        expr: portal_banco_disponivel == 0
        for: 2m
        labels: { severidade: critica }
        annotations:
          resumo: "O portal não consegue falar com o Supabase"
          oque_fazer: "npx supabase status; se parado: npx supabase start"

      - alert: RotinaAutomaticaFalhando
        expr: increase(portal_rotinas_total{resultado="erro"}[1h]) > 0
        labels: { severidade: alta }
        annotations:
          resumo: "A rotina {{ $labels.tarefa }} falhou na última hora"
          oque_fazer: "docker compose logs agendador web --tail 100"

      - alert: RespostaLenta
        expr: probe_duration_seconds{job="sondas"} > 2
        for: 5m
        labels: { severidade: media }
        annotations:
          resumo: "{{ $labels.alvo }} está demorando mais de 2 s"

      - alert: MemoriaAltaPortal
        expr: portal_process_resident_memory_bytes > 400e6
        for: 10m
        labels: { severidade: media }
        annotations:
          resumo: "O portal está usando mais de 400 MB de memória (limite 512 MB)"
